# =====================================================================
#  Mac 2 — THE EDGE: reverse proxy + round-robin load balancer + TLS
#  termination.  (Tasks D, E, F — Phase 2 Extension D failover)
#
#  Generated by scripts/configure.sh from templates/nginx.conf.tmpl.
#  {{CERT_DIR}} and {{MIME_TYPES}} are finalized ON THIS MACHINE by
#  scripts/mac2-edge.sh (or practice/run-local.sh), which writes the
#  runnable file to /tmp/team1-run/local/nginx.conf and starts:
#      sudo nginx -c /tmp/team1-run/local/nginx.conf
#
#  This single entry point is the ONLY machine clients ever touch.
#  Clients never learn backend IPs — that is the whole idea of an edge.
# =====================================================================

worker_processes  1;
pid               /tmp/team1-run/local/nginx.pid;
error_log         /tmp/team1-run/local/nginx-error.log warn;

events { worker_connections 256; }

http {
    include       {{MIME_TYPES}};
    default_type  application/octet-stream;

    # Evidence-grade access log: for EVERY request it records the client's
    # socket pair, WHICH upstream/backend was chosen, status and timings.
    # This one file proves load balancing + transport-layer concepts.
    log_format backend_trace
        '$time_iso8601 client=$remote_addr:$remote_port -> '
        'upstream=$upstream_addr status=$status bytes=$body_bytes_sent '
        'rt=$request_time urt=$upstream_response_time "$request"';

    access_log /tmp/team1-run/local/nginx-access.log backend_trace;

    # Writable temp paths (created by the setup scripts):
    client_body_temp_path /tmp/team1-run/local/nginx-tmp/client_body;
    proxy_temp_path       /tmp/team1-run/local/nginx-tmp/proxy;
    fastcgi_temp_path     /tmp/team1-run/local/nginx-tmp/fastcgi;
    uwsgi_temp_path       /tmp/team1-run/local/nginx-tmp/uwsgi;
    scgi_temp_path        /tmp/team1-run/local/nginx-tmp/scgi;

    # ---- Upstream pool (Task D) --------------------------------------
    # Strategy: ROUND-ROBIN (nginx default) — requests alternate
    # A, B, A, B ... across the pool.
    #
    # Passive health checks (Phase 2, Extension D):
    #   max_fails=2      after 2 consecutive failed attempts within ...
    #   fail_timeout=10s ... 10 s, the backend is marked DOWN for 10 s.
    #                        Failed requests are retried on the next
    #                        backend (see proxy_next_upstream below).
    upstream backends {
        server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;  # Backend A (Mac 3)
        server 127.0.0.1:3002 max_fails=2 fail_timeout=10s;  # Backend B (Mac 4)
    }

    # ---- Plain HTTP -> HTTPS redirect (ports 80 and 8080) -------------
    server {
        listen 80;
        listen 8080;
        server_name app.team1.test api.team1.test;
        return 301 https://$host$request_uri;
    }

    # ---- The HTTPS edge (Tasks D + E) ----------------------------------
    server {
        listen 443 ssl;
        listen 8443 ssl;
        http2 on;    # nginx >= 1.25.1 (Homebrew ships 1.27+). On older
                     # nginx use:  listen 443 ssl http2;

        server_name app.team1.test api.team1.test;

        # TLS termination (Task E). The certificate is signed by the
        # team's LOCAL CA (certs/make-ca-and-cert.sh) and covers
        # app/api/team1.test via SAN entries. Clients trust the CA,
        # so no warnings and no curl -k are needed.
        ssl_certificate     {{CERT_DIR}}/edge-fullchain.crt;
        ssl_certificate_key {{CERT_DIR}}/edge.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Edge-only endpoint: proves edge + DNS + TLS are still alive
        # even when BOTH backends are down (failure demo #4). Never proxied.
        location = /edge-status {
            default_type application/json;
            add_header X-Edge "team1-edge" always;
            add_header X-Edge-IP $server_addr always;
            return 200 '{"edge":"alive","note":"TLS + DNS + edge are healthy. Backends are proxied at / and /api/*"}';
        }

        # Everything else -> load balanced across the upstream pool.
        location / {
            proxy_pass http://backends;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Short timeouts so a dead backend is detected quickly:
            proxy_connect_timeout 2s;
            proxy_send_timeout    5s;
            proxy_read_timeout    10s;

            # Failover (Extension D): on connect error / timeout / these
            # statuses, nginx silently RETRIES the same request on the
            # next healthy backend before giving up.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            add_header X-Edge "team1-edge" always;
            add_header X-Edge-IP $server_addr always;
            # The backend's own X-Backend header passes through untouched —
            # that is how a client sees WHICH backend served its request.
        }
    }
}
