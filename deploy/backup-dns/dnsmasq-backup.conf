# =====================================================================
#  BACKUP private DNS server — Phase 2, Extension A
#  Runs on a machine OTHER than Mac 1 (default: Mac 3, 10.7.15.253).
#  Serves the IDENTICAL team1.test zone.
#
#  Client Macs list BOTH resolvers (primary first):
#     sudo networksetup -setdnsservers Wi-Fi 10.7.14.12 10.7.15.253
#  When the primary is stopped, macOS automatically falls back to this
#  server within ~seconds — that failover IS the demonstration.
#
#  Generated by scripts/configure.sh from templates/dnsmasq-backup.conf.tmpl
# =====================================================================

port=53
# Only this machine's LAN IP — do NOT add 127.0.0.1 here in the local
# single-machine simulation, or it collides with the primary instance.
listen-address=10.7.15.253
# bind-dynamic: bind exactly the address above (no wildcard socket), so
# primary and backup instances coexist on port 53 in the local simulation.
bind-dynamic

domain=team1.test
local=/team1.test/
domain-needed
bogus-priv
local-ttl=30

# ---- SAME records as the primary (that's the requirement) ----
address=/app.team1.test/10.7.4.94
address=/api.team1.test/10.7.4.94
address=/backend-a.team1.test/10.7.15.253
address=/backend-b.team1.test/10.7.17.142
address=/edge-standby.team1.test/10.7.15.253
address=/ns1.team1.test/10.7.14.12
address=/ns2.team1.test/10.7.15.253

log-queries
log-facility=/tmp/team1-run/dnsmasq-backup-queries.log
pid-file=/tmp/team1-run/dnsmasq-backup.pid
