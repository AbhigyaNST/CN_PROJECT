# =====================================================================
#  Mac 1 — PRIMARY private DNS server for the team1.test zone
#  (Task B — "like Route 53" for your private network)
#
#  Generated by scripts/configure.sh from templates/dnsmasq.conf.tmpl
#  Deploy:  copy to  $(brew --prefix)/etc/dnsmasq.conf   (mac1-dns.sh does it)
#  Start:   sudo brew services start dnsmasq
#           or foreground for demos:  sudo dnsmasq --conf-file=<this file> -d
# =====================================================================

# Standard DNS port, on this machine's LAN IP + loopback.
port=53
listen-address=127.0.0.1,10.7.14.12

# bind-dynamic: bind ONE socket per listen-address (instead of a wildcard
# socket on all interfaces). Required so the Phase-2 backup instance can
# coexist on the same port, and friendlier to other local services.
# Also survives DHCP address changes (picks up new IPs as they appear).
bind-dynamic

# ---- team1.test zone: answered locally, NEVER forwarded upstream ----
domain=team1.test
local=/team1.test/
domain-needed
bogus-priv

# TTL for every local record — intentionally short (30 s by default) so
# Phase 2 Extension B (record change -> cached answer -> expiry -> flush)
# can be demonstrated live in half a minute.
local-ttl=30

# ---- Project DNS records (Task B) ----
# The two names clients actually use. BOTH point at the EDGE (Mac 2),
# never at a backend — clients must not need to know backend IPs:
address=/app.team1.test/10.7.4.94
address=/api.team1.test/10.7.4.94

# Infrastructure names — used for diagnostics and Phase 2 demos:
address=/backend-a.team1.test/10.7.15.253
address=/backend-b.team1.test/10.7.17.142
address=/edge-standby.team1.test/10.7.15.253
address=/ns1.team1.test/10.7.14.12
address=/ns2.team1.test/10.7.15.253

# ---- Query logging = free evidence for Task G ----
# Every DNS query/answer lands in this file (tail it during the demo!).
log-queries
log-facility=/tmp/team1-run/dnsmasq-queries.log
pid-file=/tmp/team1-run/dnsmasq.pid

# ---- Upstream forwarding for everything OUTSIDE team1.test ----
# Default behaviour: dnsmasq reads this Mac's system resolver
# (/etc/resolv.conf), so client Macs pointed at us keep normal internet
# access. If your lab requires an explicit upstream, uncomment:
# no-resolv
# server=192.168.1.1
