# =====================================================================
#  Phase 2, Extension C — SERVICE ISOLATION (macOS pf firewall)
#  Deploy on BOTH backend machines (Mac 3 and Mac 4).
#
#  Effect: only the EDGE (Mac 2, 10.7.4.94) can open TCP connections
#  to the backend ports 3001/3002. Every other
#  machine — including test clients — gets silently dropped, so their
#  curl attempts time out. nginx keeps working normally.
#
#  Apply:     sudo ./scripts/firewall-apply.sh      (backs up state first)
#  Rollback:  sudo ./scripts/firewall-rollback.sh   (restores /etc/pf.conf)
#
#  Generated by scripts/configure.sh from templates/backend-isolation.pf.conf.tmpl
# =====================================================================

# --- Keep the standard macOS anchors so nothing else on the system changes ---
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dgram-anchor "com.apple/*"
anchor "com.apple/*"
anchor "com.apple/250.ApplicationFirewall"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

# --- Our isolation rules ---
edge_ip = "10.7.4.94"

# 1) Always allow loopback (local health checks, e.g. curl 127.0.0.1:3001).
pass in quick on lo0

# 2) Allow the edge machine to reach the backend ports.
#    ("quick" = stop evaluating further rules once this matches)
pass in quick proto tcp from $edge_ip to any port { 3001, 3002 }

# 3) Drop every other machine's attempts to reach the backend ports.
#    Note: pf is STATEFUL — replies to allowed connections flow back fine.
#    Only NEW inbound connections to these ports are affected.
block drop in quick proto tcp from any to any port { 3001, 3002 }
